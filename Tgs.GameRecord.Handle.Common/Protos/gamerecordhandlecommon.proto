syntax = "proto3";

import "phoenix/protobuf/guid.proto";
import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameRecord.Handle.Common.Protos";

package gamerecordhandlecommon;

// The greeting service definition.


// The request message containing the user's name.
message GameRecordHandleRequest {
	string game_provider_code = 1;
    string external_round_id = 2;
    string external_game_id = 3;
    string player_code = 4;
    GameRecordStatus status = 5;
    GameRecordClientStatus client_status = 6;
    google.protobuf.Timestamp external_created_on = 7;
    google.protobuf.Timestamp external_closed_on = 8;
    phoenix.protobuf.DecimalValue bet = 9;
    phoenix.protobuf.DecimalValue valid_bet = 10;
    phoenix.protobuf.DecimalValue settle = 11;
    phoenix.protobuf.DecimalValue commission = 12;
    phoenix.protobuf.DecimalValue turnover = 13;
    phoenix.protobuf.DecimalValue player_win_loss = 14;
    string additional_data = 15;
}

message GameWagerRequest {
    // 遊戲供應商代碼
    string game_provider_code = 1;
    // 玩家代碼
    string player_code = 2;
    // 投注狀態
    WagerStates wager_state = 3;
    // 投注類型
    WagerTypes wager_type = 4;
    // 免費遊戲狀態
    FreeGameStates free_game_state = 5;
    // 博取遊戲
    GambleStates gamble_state = 6;
    // 兌現狀態
    CashoutStates cashout_state = 7;
    // 重新結算狀態
    ResettleStates resettle_state = 8;
    // 三方局/回合識別碼
    string external_round_id = 9;
    // 三方投注識別碼
    string external_wager_id = 10;
    // 三方遊戲識別碼
    string external_game_id = 11;
    // 三方下注/創建時間
    google.protobuf.Timestamp external_created_on = 12;
    // 三方結算/結束時間
    google.protobuf.Timestamp external_closed_on = 13;
    // 三方派彩時間
    google.protobuf.Timestamp external_payoff_on = 14;
    // 三方重新結算時間
    google.protobuf.Timestamp external_resettle_on = 15;
    // 下注
    phoenix.protobuf.DecimalValue bet = 16;
    // 實際/有效下注
    phoenix.protobuf.DecimalValue validBet = 17;
    // 結算(包含本金)
    phoenix.protobuf.DecimalValue settle = 18;
    // 佣金
    phoenix.protobuf.DecimalValue commission = 19;
    // 遊戲平台有效投注
    phoenix.protobuf.DecimalValue turnover = 20;
    // 玩家損益/淨利
    phoenix.protobuf.DecimalValue win_loss = 21;
    // 遊戲數據
    string additional_data = 22;
}

// The response message containing the greetings.
message GameRecordPublish {
    phoenix.protobuf.GuidValue game_provider_id = 1;
    string game_provider_code = 2;
    phoenix.protobuf.GuidValue game_provider_configuration_id = 3;
    string sub_game_provider_code = 4;
    int32 game_id = 5;
    GameTypes game_type = 6;
    phoenix.protobuf.GuidValue reseller_id = 7;
    string reseller_code = 8;
    phoenix.protobuf.GuidValue licensee_id = 9;
    string licensee_code = 10;
    phoenix.protobuf.GuidValue brand_id = 11;
    string brand_code = 12;
    string player_code = 13;
    string username = 14;
    string currency_code = 15;
    phoenix.protobuf.GuidValue wallet_id = 16;
    GameRecordStatus status = 17;
    GameRecordClientStatus client_status = 18;
    string external_round_id = 19;
    string external_game_id = 20;
    google.protobuf.Timestamp external_created_on = 21;
    google.protobuf.Timestamp external_closed_on = 22;
    phoenix.protobuf.DecimalValue exchange_rate = 23;
    phoenix.protobuf.DecimalValue bet = 24;
    phoenix.protobuf.DecimalValue validBet = 25;
    phoenix.protobuf.DecimalValue settle = 26;
    phoenix.protobuf.DecimalValue commission = 27;
    phoenix.protobuf.DecimalValue turnover = 28;
    phoenix.protobuf.DecimalValue player_win_loss = 29;
    string additional_data = 30;
    google.protobuf.Timestamp handle_on = 31;
    google.protobuf.Timestamp rapid_test_on = 32;
    google.protobuf.Timestamp created_on = 33;
    google.protobuf.Timestamp closed_on = 34;
    google.protobuf.Timestamp updated_on = 35;
    string external_wager_id =36;
    WagerTypes wager_type = 37;
}

message GameWagerPublish {
    // 平台投注識別碼
    int64 wager_id = 1;
    // 遊戲供應商識別碼
    phoenix.protobuf.GuidValue game_provider_id = 2;
    // 遊戲供應商代碼
    string game_provider_code = 3;
    // 遊戲供應設定識別碼
    phoenix.protobuf.GuidValue game_provider_configuration_id = 4;
    // 子遊戲供應商代碼
    string sub_game_provider_code = 5;
    // 遊戲識別碼
    int32 game_id = 6;
    // 遊戲大類
    GameCategories game_category = 7;
    // 遊戲類型
    GameTypes game_type = 8;
    // 總公司識別碼
    phoenix.protobuf.GuidValue reseller_id = 9;
    // 總公司代碼
    string reseller_code = 10;
    // 公司識別碼
    phoenix.protobuf.GuidValue licensee_id = 11;
    // 公司代碼
    string licensee_code = 12;
    // 平台識別碼
    phoenix.protobuf.GuidValue brand_id = 13;
    // 平台代碼
    string brand_code = 14;
    // 玩家代碼
    string player_code = 15;
    // 用戶名
    string username = 16;
    // 貨幣代碼
    string currency_code = 17;
    // 錢包識別碼
    phoenix.protobuf.GuidValue wallet_id = 18;
    // 投注狀態
    WagerStates wager_state = 19;
    // 投注類型
    WagerTypes wager_type = 20;
    // 關閉狀態
    ClosedStates closed_state = 21;
    // 作廢狀態
    VoidStates void_state = 22;
    // 取消狀態
    CancelStates cancel_state = 23;
    // 免費遊戲狀態
    FreeGameStates free_game_state = 24;
    // 博取遊戲狀態
    GambleStates gamble_state = 25;
    // 兌現狀態
    CashoutStates cashout_state = 26;
    // 重新結算狀態
    ResettleStates resettle_state = 27;
    // 三方局/回合識別碼
    string external_round_id = 28;
    // 三方投注識別碼
    string external_wager_id = 29;
    // 三方遊戲識別碼
    string external_game_id = 30;
    // 三方下注/創建時間
    google.protobuf.Timestamp external_created_on = 31;
    // 三方結算/結束時間
    google.protobuf.Timestamp external_closed_on = 32;
    // 三方派彩時間
    google.protobuf.Timestamp external_payoff_on = 33;
    // 三方重新結算時間
    google.protobuf.Timestamp external_resettle_on = 34;
    // 匯率
    phoenix.protobuf.DecimalValue exchange_rate = 35;
    // 下注
    phoenix.protobuf.DecimalValue bet = 36;
    // 實際/有效下注
    phoenix.protobuf.DecimalValue validBet = 37;
    // 結算(包含本金)
    phoenix.protobuf.DecimalValue settle = 38;
    // 傭金
    phoenix.protobuf.DecimalValue commission = 39;
    // 遊戲平台有效投注
    phoenix.protobuf.DecimalValue turnover = 40;
    // 玩家損益/淨利
    phoenix.protobuf.DecimalValue win_loss = 41;
    // 遊戲數據
    string additional_data = 42;
    // 處理時間
    google.protobuf.Timestamp handle_on = 43;
    // 快篩時間
    google.protobuf.Timestamp rapid_test_on = 44;
    // 創建時間
    google.protobuf.Timestamp created_on = 45;
    // 結束時間
    google.protobuf.Timestamp closed_on = 46;
    // 更新時間
    google.protobuf.Timestamp updated_on = 47;
    // 重置狀態
    ResetStates reset_state = 48;
    // 重置時間
    google.protobuf.Timestamp reset_on = 49;
}

// 遊戲大類
enum GameCategories{
    GAME_CATEGORIES_NONE = 0;
    GAME_CATEGORIES_SPORTSBOOK = 1;
    GAME_CATEGORIES_VIRTUAL_SPORTS = 2;
    GAME_CATEGORIES_LIVE_DEALER = 3;
    GAME_CATEGORIES_CARD_GAME = 4;
    GAME_CATEGORIES_LOTTERY = 5;
    GAME_CATEGORIES_SLOT = 6;
}

// 遊戲類型
enum GameTypes{
    GAME_TYPES_NONE = 0;
    GAME_TYPES_SPORTSBOOK = 1;
    GAME_TYPES_VIRTUAL_SPORTS = 2;
    GAME_TYPES_E_SPORTS = 4;
    GAME_TYPES_LIVE_DEALER = 5;
    GAME_TYPES_CARD_GAME = 7;
    GAME_TYPES_FISHING = 9;
    GAME_TYPES_ARCADE = 11;
    GAME_TYPES_LOTTERY = 13;
    GAME_TYPES_SLOT = 15;
    GAME_TYPES_TABLE_GAME = 16;
}

// 投注狀態
enum WagerStates{
    //等待中: 我们交易员因为可能因为赔率的转换等因素，还未接受这张注单。
    WAGER_STATES_WAITING = 0;
    //進行中: 此註單還沒有結算。(注單還沒有結算的狀態有可能是這場比賽還沒有結算之類的情形。)
    WAGER_STATES_RUNNING = 1;
    //作廢: 在註單為 RUNNING 的狀態下，玩家下註註金返回。原因可能為我們交易員對此場賽事有些疑慮。可與我們聯繫詢問發生什麼狀況。
    WAGER_STATES_VOID= 2;
    //退款: 在註單為 RUNNING 的狀態下，玩家下註註金返回。原因有可能是賽事取消或發生什麼意外。
    WAGER_STATES_REFUND = 3;
    //已取消: 在註單為 WAITING 的狀態下，玩家下註註金返回。可能狀況很多。
    WAGER_STATES_REJECT = 4;
    //輸: 此註單已結算且玩家輸了此註單。
    WAGER_STATES_LOSE = 5;
    //贏: 此注单已结算且玩家赢了此注单。
    WAGER_STATES_WIN = 6;
    //和局: 此註單已結算且此註單為和局。
    WAGER_STATES_DRAW = 7;
    //半赢: 此註單已結算且玩家贏了下注額一半。
    WAGER_STATES_HALF_WIN = 8;
    //半輸:  此註單已結算且玩家輸了下注額一半。
    WAGER_STATES_HALF_LOSE = 9;
}

// 投注類型
enum WagerTypes {
    //正常
    WAGER_TYPES_NORMAL = 0;
}

// 關閉狀態
enum ClosedStates{
    CLOSED_STATES_NONE = 0;
    CLOSED_STATES_CLOSED = 1;
}

// 作廢狀態
enum VoidStates{
    VOID_STATES_NONE = 0;
    VOID_STATES_VOID = 1;
}

// 取消狀態
enum CancelStates{
    CANCEL_STATES_NONE = 0;
    CANCEL_STATES_CANCEL = 1;
}

// 免費遊戲狀態
enum FreeGameStates{
    FREE_GAME_STATES_NONE = 0;
    FREE_GAME_STATES_FREE_GAME = 1;
}

// 博取遊戲
enum GambleStates{
    GAMBLE_STATES_NONE = 0;
    GAMBLE_STATES_GAMBLE = 1;
}

// 兌現狀態
enum CashoutStates{
    CASHOUT_STATES_NONE = 0;
    CASHOUT_STATES_CASHOUT = 1;
}

// 重新结算狀態
enum ResettleStates{
    RESETTLE_STATES_NONE = 0;
    RESETTLE_STATES_RESETTLE = 1;
}

// 重置狀態
enum ResetStates{
    RESET_STATES_NONE = 0;
    RESET_STATES_RESET = 1;
}

enum GameRecordStatus {
    GAME_RECORD_STATUS_NEW = 0;
    GAME_RECORD_STATUS_OPEN = 1;
    GAME_RECORD_STATUS_CLOSED = 2;
}

enum GameRecordClientStatus{
    GAME_RECORD_CLIENT_STATUS_NEW = 0;
    GAME_RECORD_CLIENT_STATUS_OPEN = 1;
    GAME_RECORD_CLIENT_STATUS_VOID = 2;
    GAME_RECORD_CLIENT_STATUS_WIN = 3;
    GAME_RECORD_CLIENT_STATUS_LOSS = 4;
    GAME_RECORD_CLIENT_STATUS_DRAW = 5;
}

enum GameRecordGameType{
    GAME_RECORD_GAME_TYPE_UNKNOWN = 0;
    GAME_RECORD_GAME_TYPE_SPORTSBOOK = 1;
    GAME_RECORD_GAME_TYPE_VIRTUAL_SPORTS = 2;
    GAME_RECORD_GAME_TYPE_E_SPORTS = 4;
    GAME_RECORD_GAME_TYPE_LIVE_DEALER = 5;
    GAME_RECORD_GAME_TYPE_CARD_GAME = 7;
    GAME_RECORD_GAME_TYPE_FISHING = 9;
    GAME_RECORD_GAME_TYPE_ARCADE = 11;
    GAME_RECORD_GAME_TYPE_LOTTERY = 13;
    GAME_RECORD_GAME_TYPE_SLOT = 15;
    GAME_RECORD_GAME_TYPE_TABLE_GAME = 16;
    GAME_RECORD_GAME_TYPE_OTHER = 99;
}